version: '3.8'

services:
  moodle:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ../moodle-test/moodledata:/var/www/moodledata
    environment:
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodle_user
      MOODLE_DATABASE_PASSWORD: moodle_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moodle_network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle_user
      MYSQL_PASSWORD: moodle_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ../moodle-test/moodledb:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "moodle_user", "--password=moodle_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moodle_network

volumes:
  moodle_db:
  moodledata:

networks:
  moodle_network:
    driver: bridge